<title>Paper Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Check AI-assisted copy against its sources, one claim at a time. Runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: proof sheets on a copy desk. The draft is a live proof on the left; the claim being checked,
   its source clipping and the editor's queries sit on the sheet to its right. Red pencil for problems,
   highlighter for careful words, blue pencil for the editor's own changes. */
:root {
  --desk: #e8eae5;
  --sheet: #ffffff;
  --sheet-2: #f5f6f3;
  --ink: #17191c;
  --ink-2: #545b64;
  --ink-3: #868d96;
  --rule: #dcdfd9;
  --rule-2: #bdc1ba;
  --pencil: #2456a6;
  --pencil-ink: #ffffff;
  --pencil-wash: #e7eefa;
  --red: #b3261a;
  --red-wash: #fbe8e5;
  --hi: #ffef9e;
  --hi-ink: #6a5000;
  --ok: #1d7446;
  --ok-wash: #e1f1e7;
  --hold: #6a3eae;
  --hold-wash: #efe8fa;
  --shadow: 0 1px 0 rgba(23, 25, 28, .05), 0 2px 6px rgba(23, 25, 28, .07);
  --lift: 0 10px 30px rgba(23, 25, 28, .16);
  --font-copy: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-type: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0f1113; --sheet: #191c20; --sheet-2: #1f2328; --ink: #eceef0; --ink-2: #a5acb5; --ink-3: #737a84;
    --rule: #2b3036; --rule-2: #3e444c; --pencil: #93b6f5; --pencil-ink: #0d1624; --pencil-wash: #1b2740;
    --red: #f19489; --red-wash: #3a1d1a; --hi: #4d4213; --hi-ink: #f6dc78; --ok: #81d4a5; --ok-wash: #15301f;
    --hold: #c6a9f5; --hold-wash: #2a2140; --shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .45);
    --lift: 0 10px 30px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0f1113; --sheet: #191c20; --sheet-2: #1f2328; --ink: #eceef0; --ink-2: #a5acb5; --ink-3: #737a84;
  --rule: #2b3036; --rule-2: #3e444c; --pencil: #93b6f5; --pencil-ink: #0d1624; --pencil-wash: #1b2740;
  --red: #f19489; --red-wash: #3a1d1a; --hi: #4d4213; --hi-ink: #f6dc78; --ok: #81d4a5; --ok-wash: #15301f;
  --hold: #c6a9f5; --hold-wash: #2a2140; --shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .45);
  --lift: 0 10px 30px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
a { color: var(--pencil); text-underline-offset: 2px; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.type { font-family: var(--font-type); }
.eyebrow { font: 700 11.5px/1.2 var(--font-type); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sheet { background: var(--sheet); box-shadow: var(--shadow); border-radius: 2px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 10px 28px; flex-wrap: wrap; min-height: 58px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand b { font: 600 21px/1 var(--font-copy); letter-spacing: -.015em; font-variation-settings: "opsz" 72; }
.steps { display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; }
.steps button { border: 0; background: none; padding: 8px 10px; cursor: pointer; color: var(--ink-3); font-size: 14px; font-weight: 500; display: flex; gap: 7px; align-items: baseline; border-bottom: 2px solid transparent; }
.steps button .n { font: 700 12px var(--font-type); }
.steps button:hover:not(:disabled) { color: var(--ink); }
.steps button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--ink); }
.steps button:disabled { opacity: .45; cursor: default; }
.top-tools { margin-left: auto; display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.who input { width: 9.5em; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 2px; background: var(--sheet-2); font-size: 13px; }
.who input:focus { outline: none; border-color: var(--pencil); background: var(--sheet); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 3px; border: 1px solid var(--rule-2); background: var(--sheet); cursor: pointer; font-size: 14px; font-weight: 600; line-height: 1.2; color: var(--ink); text-decoration: none; transition: background .12s, border-color .12s, transform .06s; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.btn-primary:hover { background: var(--pencil); border-color: var(--pencil); color: var(--pencil-ink); }
.btn-quiet { border-color: transparent; background: none; color: var(--ink-2); font-weight: 500; }
.btn-quiet:hover { color: var(--ink); background: var(--sheet-2); border-color: transparent; }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn svg { width: 16px; height: 16px; flex: none; }
kbd { font: 700 10.5px/1 var(--font-type); border: 1px solid currentColor; border-radius: 2px; padding: 2px 4px; opacity: .55; }

main { padding-block: 28px 72px; }

/* Setup */
.setup { display: grid; gap: 22px; }
.setup-intro { display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: end; justify-content: space-between; }
.setup-intro h1 { font: 600 clamp(28px, 4vw, 40px)/1.08 var(--font-copy); letter-spacing: -.02em; font-variation-settings: "opsz" 72; max-width: 18ch; }
.setup-intro p { color: var(--ink-2); max-width: 54ch; font-size: 15.5px; }
.practice { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 22px; align-items: center; padding: 18px 22px; background: var(--ink); color: var(--sheet); border-radius: 2px; }
.practice .eyebrow { color: color-mix(in srgb, var(--sheet) 60%, transparent); }
.practice p { font: 17px/1.4 var(--font-copy); }
.practice .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.practice .btn { background: var(--sheet); color: var(--ink); border-color: var(--sheet); }
.practice .btn.alt { background: none; color: var(--sheet); border-color: color-mix(in srgb, var(--sheet) 40%, transparent); }
.setup-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.manuscript { padding: 22px 26px 26px; display: grid; gap: 14px; }
.slug-row { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.slug-row label { flex: none; }
.slug-row input { flex: 1; min-width: 0; border: 0; background: none; font: 700 14px var(--font-type); letter-spacing: .04em; text-transform: uppercase; padding: 2px 0; }
.slug-row input:focus { outline: none; }
.manuscript textarea, .src-sheet textarea { width: 100%; border: 0; background: none; resize: vertical; padding: 0; font: 18px/1.65 var(--font-copy); color: var(--ink); min-height: 300px; }
.manuscript textarea:focus, .src-sheet textarea:focus { outline: none; }
.madlib { font: 17px/2 var(--font-copy); color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 12px; }
.madlib input, .madlib select { font: 600 16px var(--font-ui); color: var(--ink); border: 0; border-bottom: 1.5px solid var(--rule-2); background: none; padding: 0 2px; border-radius: 0; }
.madlib input { width: 9em; }
.madlib input:focus, .madlib select:focus { outline: none; border-bottom-color: var(--pencil); }
.sources { display: grid; gap: 14px; }
.src-sheet { padding: 16px 20px 18px; display: grid; gap: 8px; }
.src-sheet + .src-sheet { margin-top: -4px; }
.src-head { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.src-head .eyebrow { flex: none; }
.src-head input { flex: 1; min-width: 0; border: 0; background: none; font: 600 14.5px var(--font-ui); padding: 2px 0; }
.src-head input:focus { outline: none; }
.src-sheet textarea { min-height: 150px; font-size: 16px; }
.src-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.go-row { display: flex; gap: 14px 20px; flex-wrap: wrap; align-items: center; }
.privacy { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.privacy svg { width: 15px; height: 15px; color: var(--ok); flex: none; }

/* Review: claim strip */
.strip-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 59px); z-index: 15; background: color-mix(in srgb, var(--desk) 92%, transparent); backdrop-filter: blur(6px); margin: -28px 0 20px; padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; border-bottom: 1px solid var(--rule); }
.strip { display: flex; flex-wrap: wrap; gap: 4px; }
.sq { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink-2); font: 700 12px var(--font-type); cursor: pointer; position: relative; border-radius: 2px; transition: background .2s, color .2s, border-color .2s; }
.sq:hover { border-color: var(--ink); color: var(--ink); }
.sq.flagged::after { content: ""; position: absolute; top: 2px; right: 2px; width: 0; height: 0; border-top: 6px solid var(--red); border-left: 6px solid transparent; }
.sq.supported { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.sq.fixed { background: var(--pencil); border-color: var(--pencil); color: var(--pencil-ink); }
.sq.open { background: var(--hold); border-color: var(--hold); color: var(--sheet); }
.sq.cut, .sq.notclaim { background: repeating-linear-gradient(-45deg, var(--sheet-2), var(--sheet-2) 3px, var(--rule) 3px, var(--rule) 4px); color: var(--ink-3); }
.sq[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.strip-count { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.strip-count b { color: var(--ink); font-weight: 700; }
.strip-bar .btn { margin-left: auto; }

/* Review: layout */
.review-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 22px; align-items: start; }
.proof-sheet { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 128px); padding: 22px 26px 26px; max-height: calc(100vh - 150px); overflow: auto; }
.proof-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 10px; margin-bottom: 16px; }
.proof-head .slug { font: 700 13px var(--font-type); letter-spacing: .04em; text-transform: uppercase; overflow-wrap: anywhere; }
.article { font: 18px/1.75 var(--font-copy); }
.article p + p { margin-top: 14px; }
.sent { cursor: pointer; border-radius: 2px; padding: 1px 0; transition: background .15s, box-shadow .15s, color .15s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sent:hover { background: var(--sheet-2); }
.sent:focus-visible { outline: 2px solid var(--pencil); outline-offset: 1px; }
.sent.on { background: var(--pencil-wash); box-shadow: inset 0 -2px 0 var(--pencil); }
.sent.s-cut { text-decoration: line-through; text-decoration-color: var(--red); color: var(--ink-3); }
.sent.s-notclaim { color: var(--ink-2); }
.sent.s-open { background: var(--hold-wash); }
.sent.s-open.on { box-shadow: inset 0 -2px 0 var(--hold); }
.cnum { display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; padding: 0 .2em; margin: 0 .28em 0 .05em; border: 1.25px solid currentColor; border-radius: 99px; font: 700 10.5px/1 var(--font-type); vertical-align: .32em; color: var(--ink-3); transition: background .2s, color .2s, transform .2s; }
.cnum.flagged { color: var(--red); }
.cnum.soft { color: var(--hi-ink); }
.cnum.supported { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.cnum.fixed { background: var(--pencil); border-color: var(--pencil); color: var(--pencil-ink); }
.cnum.open { background: var(--hold); border-color: var(--hold); color: var(--sheet); }
.cnum.cut, .cnum.notclaim { color: var(--ink-3); border-style: dashed; }
.cnum.pop { animation: pop .35s ease-out; }
@keyframes pop { 40% { transform: scale(1.35); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Marks */
mark { color: inherit; background: none; }
mark.m-strong { text-decoration: underline wavy var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
.detail mark.m-strong, .clip mark.m-strong { background: var(--red-wash); border-radius: 2px; }
mark.m-soft { background: linear-gradient(100deg, transparent 0, var(--hi) 3px, var(--hi) calc(100% - 3px), transparent 100%); padding: 0 2px; border-radius: 3px; }
.shared { text-decoration: underline dotted var(--ink-3); text-underline-offset: 4px; }
mark.lit { outline: 2px solid var(--pencil); outline-offset: 1px; border-radius: 2px; }

/* Review: the claim sheet */
.detail { padding: 22px 26px 24px; display: grid; gap: 22px; }
.claim-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.claim-head h2 { font: 600 24px/1.1 var(--font-copy); letter-spacing: -.01em; font-variation-settings: "opsz" 60; }
.claim-head .nav { margin-left: auto; display: flex; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 700 11px/1 var(--font-type); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 2px; border: 1px solid currentColor; }
.chip svg { width: 12px; height: 12px; }
.chip.unreviewed { color: var(--ink-3); }
.chip.supported { color: var(--ok); background: var(--ok-wash); border-color: transparent; }
.chip.fixed { color: var(--pencil); background: var(--pencil-wash); border-color: transparent; }
.chip.open { color: var(--hold); background: var(--hold-wash); border-color: transparent; }
.chip.cut, .chip.notclaim { color: var(--ink-2); background: var(--sheet-2); border-color: transparent; }
.coach { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 16px; background: var(--sheet-2); border: 1px dashed var(--rule-2); }
.coach .step { font: 700 22px/1 var(--font-type); color: var(--pencil); padding-top: 2px; }
.coach p { font-size: 14.5px; }
.coach p strong { font-weight: 700; }
.says { display: grid; gap: 8px; }
.draft-text { font: 23px/1.5 var(--font-copy); letter-spacing: -.005em; overflow-wrap: anywhere; }
.was { font-size: 13.5px; color: var(--ink-3); }
.was del { color: var(--ink-3); text-decoration-color: var(--red); }
.clip { border: 1px solid var(--rule); background: var(--sheet); }
.clip + .clip { margin-top: 10px; }
.clip-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid var(--rule); background: var(--sheet-2); }
.clip-head .eyebrow { color: var(--ink-2); overflow-wrap: anywhere; }
.clip-body { padding: 10px 12px 12px; display: grid; gap: 6px; max-height: 340px; overflow: auto; }
.line { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.gut { font: 700 11px var(--font-type); color: var(--ink-3); text-align: right; }
.line .txt { font: 17px/1.55 var(--font-copy); overflow-wrap: anywhere; }
.line.ctx .txt { color: var(--ink-3); }
.line.ev .gut { color: var(--ink); }
.weak { font-size: 13.5px; color: var(--red); font-weight: 600; }
.clip-actions { display: flex; gap: 4px 8px; flex-wrap: wrap; margin-top: 6px; }
.queries { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.q { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 12px; padding: 12px 6px 12px 0; border-bottom: 1px solid var(--rule); cursor: default; transition: background .15s; }
.q:hover, .q:focus-within, .q.lit { background: var(--sheet-2); }
.q-id { font: 700 12px/1.6 var(--font-type); text-align: right; }
.q-strong .q-id { color: var(--red); }
.q-soft .q-id { color: var(--hi-ink); }
.q-title { font-weight: 650; font-size: 15px; }
.q-why { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.q-none { padding: 12px 0; color: var(--ink-2); border-bottom: 1px solid var(--rule); font-size: 14.5px; }
.decide { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.dbtn { display: grid; gap: 3px; justify-items: start; text-align: left; padding: 11px 12px; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 3px; cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .06s; }
.dbtn:active { transform: translateY(1px); }
.dbtn .row { display: flex; gap: 7px; align-items: center; font-weight: 650; font-size: 14.5px; }
.dbtn .row svg { width: 16px; height: 16px; }
.dbtn small { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.dbtn.ok .row { color: var(--ok); }
.dbtn.fix .row { color: var(--pencil); }
.dbtn.open .row { color: var(--hold); }
.dbtn.not .row { color: var(--ink-2); }
.dbtn:hover { border-color: currentColor; }
.dbtn.ok:hover { border-color: var(--ok); } .dbtn.fix:hover { border-color: var(--pencil); } .dbtn.open:hover { border-color: var(--hold); } .dbtn.not:hover { border-color: var(--ink-2); }
.dbtn[aria-pressed="true"].ok { background: var(--ok); border-color: var(--ok); }
.dbtn[aria-pressed="true"].fix { background: var(--pencil); border-color: var(--pencil); }
.dbtn[aria-pressed="true"].open { background: var(--hold); border-color: var(--hold); }
.dbtn[aria-pressed="true"].not { background: var(--ink-2); border-color: var(--ink-2); }
.dbtn[aria-pressed="true"] .row, .dbtn[aria-pressed="true"] small { color: var(--sheet); }
.editor { display: grid; gap: 12px; padding: 16px; background: var(--sheet-2); border-top: 2px solid var(--ink); }
.editor .label, .field label { font-weight: 650; font-size: 14px; }
.editor textarea { width: 100%; min-height: 96px; border: 1px solid var(--rule-2); border-radius: 2px; background: var(--sheet); padding: 10px 12px; font: 19px/1.5 var(--font-copy); resize: vertical; }
.editor textarea:focus, .input:focus { outline: none; border-color: var(--pencil); box-shadow: 0 0 0 3px var(--pencil-wash); }
.recheck { font-size: 13.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
.recheck.clean { color: var(--ok); }
.input { width: 100%; border: 1px solid var(--rule-2); border-radius: 2px; background: var(--sheet); padding: 8px 10px; }
.field { display: grid; gap: 6px; }
.task-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; }
.checks label { display: flex; gap: 7px; align-items: center; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.decided-note { font-size: 13.5px; color: var(--ink-2); display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
.note-field input { font-size: 14px; }
.picker { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--rule); background: var(--sheet-2); }
.picker ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; display: grid; gap: 2px; }
.picker li label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 6px 8px; cursor: pointer; font: 16px/1.45 var(--font-copy); border-radius: 2px; }
.picker li label:hover { background: var(--sheet); }
